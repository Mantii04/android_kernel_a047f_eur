name: Build Android-Wuwa Kernel Module (SM-A047F)

on:
  workflow_dispatch:
    inputs:
      kernel_repo_url:
        description: 'URL of the kernel source repository (e.g., https://github.com/Mantii04/android_kernel_a047f_eur)'
        required: true
        default: 'https://github.com/Mantii04/android_kernel_a047f_eur'
      kernel_branch:
        description: 'Branch of the kernel source repository'
        required: true
        default: 'sus'
      android_wuwa_repo_url:
        description: 'URL of the android-wuwa repository'
        required: true
        default: 'https://github.com/fuqiuluo/android-wuwa.git'
      android_wuwa_branch:
        description: 'Branch of the android-wuwa repository'
        required: true
        default: 'master'

jobs:
  build_module:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.kernel_repo_url }}
        ref: ${{ github.event.inputs.kernel_branch }}
        path: kernel_source

    - name: Checkout Android-Wuwa Source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.android_wuwa_repo_url }}
        ref: ${{ github.event.inputs.android_wuwa_branch }}
        path: android_wuwa_source

    - name: Set up Build Environment
      run: |
        sudo apt update -y
        sudo apt install -y libncurses5-dev bc bison flex make gcc g++ git python3 device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils default-jdk gnupg curl libc6-dev libreadline-dev libgl1 libgl1-mesa-dev libc6-dev libtinfo6 openssl libelf-dev pahole libssl-dev

    - name: Set Kernel Build Variables
      run: |
        echo "KDIR=$(pwd)/kernel_source" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=$(pwd)/kernel_source/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "CC=$(pwd)/kernel_source/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang" >> $GITHUB_ENV
        echo "DEFCONFIG=exynos850-a04sxx_defconfig" >> $GITHUB_ENV

    - name: Prepare Kernel Source for Module Build
      run: |
        cd kernel_source
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} ${DEFCONFIG}
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} prepare
        make O=out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} modules_prepare
        cd ..

    - name: Build Android-Wuwa Module
      run: |
        cd android_wuwa_source
        make KDIR=${KDIR}/kernel_source/out ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE}

    - name: Upload Android-Wuwa Module
      uses: actions/upload-artifact@v4
      with:
        name: android-wuwa-module
        path: android_wuwa_source/android-wuwa.ko
