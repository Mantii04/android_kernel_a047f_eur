name: Modified Kernel Compilation

on:
  workflow_dispatch:
    inputs:      
      tag:
        description: 'Release Tag'
        required: true    

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true

    - name: Set up build environment
      run: |
        sudo apt update -y  
        sudo apt install libncurses5-dev -y

    - name: Apply Background Kill Disable Modifications
      run: |
        # 1. Disable OOM Killer in mm/oom_kill.c
        sed -i 's/if (oom_killer_disabled)/if (true)/g' mm/oom_kill.c
        
        # 2. Disable VM Pressure Reporting in mm/vmpressure.c
        # We replace the return line in vmpressure_calc_level
        sed -i 's/return vmpressure_level(pressure);/return VMPRESSURE_LOW;/g' mm/vmpressure.c
        
        # 3. Disable HPA Killer in mm/hpa.c
        # Insert return -ESRCH; at the beginning of hpa_killer function
        sed -i '/static int hpa_killer(void)/!b;n;i\\treturn -ESRCH;' mm/hpa.c

    - name: Set environment variable
      run: |
        echo "BUILD_KERNEL_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV        

    - name: Compile Kernel
      run: |
        # Disable interactive menuconfig in build.sh
        sed -i 's/make ${ARGS} menuconfig/# make ${ARGS} menuconfig/g' build.sh
        bash build.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Modified-Kernel-SM-A047F-${{ github.event.inputs.tag }}
        path: build/*.tar
