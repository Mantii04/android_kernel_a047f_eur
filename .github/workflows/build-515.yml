name: Build memkernel for GKI 5.15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm build-essential bison flex libssl-dev bc libelf-dev dwarves

      - name: Create Swap Space (Fixes Out Of Memory)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Clone GKI 5.15 kernel
        run: |
          git clone --depth=1 -b android13-5.15 https://android.googlesource.com/kernel/common /tmp/gki515

      - name: Build kernel (generates Module.symvers)
        run: |
          cd /tmp/gki515
          make ARCH=arm64 LLVM=1 gki_defconfig
          # Added -j2 to limit memory usage and prevent OOM
          make ARCH=arm64 LLVM=1 -j2

      - name: Build memkernel
        run: |
          cd $GITHUB_WORKSPACE/memkernel
          make KDIR=/tmp/gki515 ARCH=arm64 LLVM=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: memkernel-gki515
          path: memkernel/memkernel.ko
