name: MX Kernel Module (Fast Build)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build tag
        required: true
        default: dev

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # Checkout kernel (FULL HISTORY for submodules)
      # -----------------------------
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # -----------------------------
      # Checkout module
      # -----------------------------
      - name: Checkout MX Module
        uses: actions/checkout@v4
        with:
          repository: fuqiuluo/android-wuwa
          ref: master
          path: mx_module

      # -----------------------------
      # CACHE TOOLCHAIN (BIG SPEED BOOST)
      # -----------------------------
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            toolchain
          key: toolchain-${{ runner.os }}

      # -----------------------------
      # Install dependencies (MINIMIZED)
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio flex git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 make \
            openssl pahole python3 rsync unzip xz-utils zip zlib1g-dev

      # -----------------------------
      # Build kernel (FAST PATH)
      # -----------------------------
      - name: Build kernel via build.sh
        run: |
          chmod +x build.sh
          export BUILD_KERNEL_VERSION=${{ github.event.inputs.tag }}

          # prevent reinstall every run if your script supports it
          touch .requirements || true

          bash build.sh

      # -----------------------------
      # Export kernel paths
      # -----------------------------
      - name: Set paths
        run: |
          echo "KDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "OUT=$GITHUB_WORKSPACE/out" >> $GITHUB_ENV

      # -----------------------------
      # BUILD MODULE (FIXED + FAST)
      # -----------------------------
      - name: Build MX module
        run: |
          make -C mx_module \
            KDIR=$KDIR \
            O=$OUT \
            -j$(nproc) \
            modules

      # -----------------------------
      # Package ONLY required outputs
      # -----------------------------
      - name: Package module
        run: |
          mkdir -p output
          find mx_module -name "*.ko" -exec cp {} output/ \;

          zip -r mx_kernel_module.zip output

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mx_kernel_module-${{ github.event.inputs.tag }}
          path: mx_kernel_module.zip