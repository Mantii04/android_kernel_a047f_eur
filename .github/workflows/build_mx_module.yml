name: MX Kernel Module Build (Stable)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build tag
        required: true
        default: dev

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # Checkout kernel source
      # -----------------------------
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # -----------------------------
      # Checkout MX module
      # -----------------------------
      - name: Checkout MX Module
        uses: actions/checkout@v4
        with:
          repository: fuqiuluo/android-wuwa
          ref: master
          path: mx_module

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio flex git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 make \
            openssl pahole python3 rsync unzip xz-utils zip zlib1g-dev

      # -----------------------------
      # Build kernel (IMPORTANT)
      # -----------------------------
      - name: Build Kernel
        run: |
          chmod +x build.sh
          export BUILD_KERNEL_VERSION=${{ github.event.inputs.tag }}
          bash build.sh

      # -----------------------------
      # Force clean Kbuild environment
      # -----------------------------
      - name: Set kernel paths
        run: |
          echo "KDIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "OUT=$GITHUB_WORKSPACE/out" >> $GITHUB_ENV

      # -----------------------------
      # Patch MX module (REMOVE WUWA)
      # -----------------------------
      - name: Fix MX module to Kbuild
        run: |
          sed -i '/WUWA/d' mx_module/Makefile || true

          cat > mx_module/Makefile << 'EOF'
obj-m += mx.o

KDIR ?= /lib/modules/$(shell uname -r)/build
PWD := $(shell pwd)

all:
	$(MAKE) -C $(KDIR) M=$(PWD) modules

modules:
	$(MAKE) -C $(KDIR) M=$(PWD) modules

clean:
	$(MAKE) -C $(KDIR) M=$(PWD) clean
EOF

      # -----------------------------
      # Build MX module
      # -----------------------------
      - name: Build MX Module
        run: |
          make -C kernel \
            M=$GITHUB_WORKSPACE/mx_module \
            O=$GITHUB_WORKSPACE/out \
            modules

      # -----------------------------
      # Collect .ko files
      # -----------------------------
      - name: Package module
        run: |
          mkdir -p output
          find mx_module -name "*.ko" -exec cp {} output/ \;

          cd output
          zip -r ../mx_kernel_module.zip .

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mx_kernel_module-${{ github.event.inputs.tag }}
          path: mx_kernel_module.zip