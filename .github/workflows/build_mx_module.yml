name: Build MX Kernel Module

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel source branch'
        required: true
        default: 'sus'
      mx_repo_owner_repo:
        description: 'MX repository (owner/repo format, e.g., fuqiuluo/android-wuwa)'
        required: true
        default: 'fuqiuluo/android-wuwa'
      mx_branch:
        description: 'MX repository branch'
        required: true
        default: 'master'
      defconfig_name:
        description: 'Kernel defconfig name (e.g., exynos850-a04sxx_defconfig)'
        required: true
        default: 'exynos850-a04sxx_defconfig'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.event.inputs.kernel_branch }}
        path: kernel

    - name: Checkout MX Module Source
      uses: actions/checkout@v4
      with:
        repository: ${{ github.event.inputs.mx_repo_owner_repo }}
        ref: ${{ github.event.inputs.mx_branch }}
        path: mx_module

    - name: Install Build Dependencies
      run: |
        sudo apt update -y
        sudo apt install -y git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 p7zip-full android-sdk-libsparse-utils erofs-utils \
        default-jdk git gnupg flex bison gperf build-essential zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev \
        python3 make sudo gcc g++ bc grep tofrodos python3-markdown libxml2-utils xsltproc zlib1g-dev python-is-python3 libc6-dev libtinfo6 \
        make repo cpio kmod openssl libelf-dev pahole libssl-dev --fix-missing
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb

    - name: Set up Kernel Build Environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CROSS_COMPILE=${{ github.workspace }}/kernel/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=${{ github.workspace }}/kernel/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang" >> $GITHUB_ENV
        echo "PATH=${{ github.workspace }}/kernel/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:${{ github.workspace }}/kernel/toolchain/clang/host/linux-x86/clang-r353983c/bin:$PATH" >> $GITHUB_ENV
        cd kernel
        make ${{ github.event.inputs.defconfig_name }}

    - name: Build Kernel Module
      run: |
        cd mx_module
        make -C ${{ github.workspace }}/kernel M=$(pwd) modules

    - name: Package Module
      run: |
        mkdir -p output
        find mx_module -name "*.ko" -exec cp {} output/ \;
        zip -r mx_module_flashable.zip output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mx_kernel_module
        path: mx_module_flashable.zip
