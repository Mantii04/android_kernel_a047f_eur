name: Build MX Kernel Module

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Kernel source branch
        required: true
        default: sus

      mx_repo_owner_repo:
        description: MX repo (owner/repo)
        required: true
        default: fuqiuluo/android-wuwa

      mx_branch:
        description: MX branch
        required: true
        default: master

      defconfig_name:
        description: Kernel defconfig
        required: true
        default: exynos850-a04sxx_defconfig


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout kernel (WITH SUBMODULES FIX)
      # ----------------------------
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.inputs.kernel_branch }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      # ----------------------------
      # Checkout MX module
      # ----------------------------
      - name: Checkout MX Module
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.mx_repo_owner_repo }}
          ref: ${{ github.event.inputs.mx_branch }}
          path: mx_module

      # ----------------------------
      # Fix submodules explicitly (IMPORTANT)
      # ----------------------------
      - name: Init Kernel Submodules
        run: |
          cd kernel
          git submodule sync --recursive
          git submodule update --init --recursive

      # ----------------------------
      # Fix hidden CRLF issues (safe, does NOT harm Linux repo)
      # ----------------------------
      - name: Fix line endings
        run: |
          find kernel -type f -name "Kconfig" -exec sed -i 's/\r$//' {} \;

      # ----------------------------
      # Install dependencies
      # ----------------------------
      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            bc bison build-essential cpio curl flex git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 make \
            openssl pahole python3 rsync unzip xz-utils zip zlib1g-dev

      # ----------------------------
      # Kernel environment
      # ----------------------------
      - name: Setup environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

          echo "CROSS_COMPILE=${{ github.workspace }}/kernel/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-" >> $GITHUB_ENV

          echo "CC=${{ github.workspace }}/kernel/toolchain/clang/host/linux-x86/clang-r353983c/bin/clang" >> $GITHUB_ENV

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

          echo "${{ github.workspace }}/kernel/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/kernel/toolchain/clang/host/linux-x86/clang-r353983c/bin" >> $GITHUB_PATH

      # ----------------------------
      # DEFCONFIG (this is where your error happens)
      # ----------------------------
      - name: Run defconfig
        working-directory: kernel
        run: |
          make ${{ github.event.inputs.defconfig_name }}

      # ----------------------------
      # Build external module ONLY
      # ----------------------------
      - name: Build module
        run: |
          make -C kernel M=${{ github.workspace }}/mx_module modules

      # ----------------------------
      # Package result
      # ----------------------------
      - name: Package module
        run: |
          mkdir -p output
          find mx_module -name "*.ko" -exec cp {} output/ \;
          cd output
          zip -r ../mx_module.zip .

      # ----------------------------
      # Upload artifact
      # ----------------------------
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mx_kernel_module
          path: mx_module.zip