name: Build MX Kernel Module

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Build tag
        required: true
        default: dev

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # -----------------------------
      # Checkout kernel (WITH SUBMODULES)
      # -----------------------------
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # -----------------------------
      # Checkout MX module
      # -----------------------------
      - name: Checkout MX Module Source
        uses: actions/checkout@v4
        with:
          repository: fuqiuluo/android-wuwa
          ref: master
          path: mx_module

      # -----------------------------
      # Dependencies (minimal but safe)
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential cpio curl flex git kmod \
            libelf-dev libncurses-dev libssl-dev lz4 make \
            openssl pahole python3 rsync unzip xz-utils zip zlib1g-dev

      # -----------------------------
      # Make build.sh executable
      # -----------------------------
      - name: Prepare build script
        run: |
          chmod +x build.sh

      # -----------------------------
      # Build kernel using YOUR system
      # THIS FIXES ALL KCONFIG / KSU / GPU ISSUES
      # -----------------------------
      - name: Build kernel (build.sh)
        run: |
          export BUILD_KERNEL_VERSION=${{ github.event.inputs.tag }}
          bash build.sh

      # -----------------------------
      # Verify kernel output exists
      # -----------------------------
      - name: Verify kernel output
        run: |
          ls -lah out/arch/arm64/boot || true
          test -f out/arch/arm64/boot/Image || echo "Kernel image missing!"

      # -----------------------------
      # Build MX kernel module
      # -----------------------------
      - name: Build MX module
        run: |
          make -C mx_module \
            M=$GITHUB_WORKSPACE/mx_module \
            O=$GITHUB_WORKSPACE/out \
            modules

      # -----------------------------
      # Collect modules
      # -----------------------------
      - name: Package modules
        run: |
          mkdir -p output
          find mx_module -name "*.ko" -exec cp {} output/ \;

          cd output
          zip -r ../mx_kernel_module.zip .

      # -----------------------------
      # Upload artifact
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx_kernel_module
          path: mx_kernel_module.zip